<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ツンデレAR動画プレイヤー</title>
    <!-- A-Frame と MindARの読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); color: white; font-weight: bold; font-size: 22px;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; cursor: pointer; text-align: center;
        }
    </style>
</head>
<body>
    <!-- 画面タップ用のオーバーレイ（音声の再生制限を解除するため） -->
    <div id="overlay">画面をタップして<br>ARカメラを起動</div>

    <!-- ARシーンの設定（targets.mindを読み込む） -->
    <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <!-- 動画ファイル名を指定 -->
            <video id="ar-video" src="video.mp4" webkit-playsinline playsinline loop crossorigin="anonymous"></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- マーカーを認識した時の動作 -->
        <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
            <a-video src="#ar-video" position="0 0 0" height="1" width="1"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const overlay = document.getElementById('overlay');
        const video = document.getElementById('ar-video');
        const target = document.getElementById('target-entity');

        // タップしてカメラ起動＆音声制限を解除
        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            video.play().then(() => { video.pause(); }).catch(e => console.log(e));
        });

        // カメラがマーカーを見つけたら動画を再生
        target.addEventListener('targetFound', () => {
            video.play();
        });

        // カメラからマーカーが外れたら動画を一時停止
        target.addEventListener('targetLost', () => {
            video.pause();
        });
    </script>
</body>
</html>
